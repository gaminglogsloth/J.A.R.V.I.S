<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070d">
<title>J.A.R.V.I.S. Interface</title>
<style>
:root{color-scheme:dark;--bg:#02070d;--cyan:#5fd8ff;--blue:#7cc4ff;--gold:#ffd98a;--ink:#b8d7e5;--glass:rgba(5,16,26,.86)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background-color:var(--bg);color:#eaf8ff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(66,185,227,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(66,185,227,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 15%,transparent 90%);z-index:0}
#app{height:100dvh;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;padding:clamp(14px,3vh,28px) 18px 94px;transition:color .5s}header{width:min(100%,1000px);display:flex;justify-content:space-between;align-items:center;color:#86b8ce;font:11px/1.2 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}.live{display:flex;gap:9px;align-items:center}.led{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 10px var(--cyan)}
#hud{width:min(78vmin,78vw,720px);aspect-ratio:1;margin:auto;display:grid;place-items:center;opacity:1;transform:scale(1);transition:opacity .9s ease,transform .9s ease;filter:drop-shadow(0 0 16px rgba(33,151,208,.1))}#hud svg{width:100%;height:100%;overflow:visible}.outer{fill:none;stroke:#1d9bd6;stroke-width:1.25;stroke-dasharray:92 13 42 11 165 18;transform-origin:300px 300px;animation:spin 90s linear infinite}.ticks{stroke:#5fd8ff;stroke-width:1.3;opacity:.68;transform-origin:300px 300px;animation:spin 120s linear infinite reverse}.seg{fill:none;stroke:#356486;stroke-width:12;stroke-linecap:butt;opacity:.65}.progress{fill:none;stroke:#7cc4ff;stroke-width:12;stroke-linecap:butt;stroke-dasharray:710 1293;filter:drop-shadow(0 0 5px #4bafff);transition:stroke-dasharray .8s,filter .4s}.accent{fill:none;stroke:#ffb42e;stroke-width:2;stroke-dasharray:82 1112;stroke-linecap:round;transform-origin:300px 300px;animation:spin 24s linear infinite}.accent-dot{fill:#ffb42e;filter:drop-shadow(0 0 4px #ff9d00)}.inner{fill:none;stroke:#71c9e8;stroke-width:1;opacity:.42}.dash{fill:none;stroke:#65d4fb;stroke-width:1;stroke-dasharray:2 8;opacity:.5;transform-origin:300px 300px;animation:spin 55s linear infinite reverse}.center{fill:rgba(3,12,20,.9);stroke:#1d7299;stroke-width:1}.gear{fill:none;stroke:#53b6d9;stroke-width:.7;opacity:.13}.brand{fill:#f4fbff;font:700 24px/1 system-ui,sans-serif;letter-spacing:6px;text-anchor:middle;filter:drop-shadow(0 0 7px rgba(95,216,255,.85))}.bar{stroke:#5fd8ff;stroke-width:1.3;opacity:.78}.small-label{fill:#69abc2;font:7px ui-monospace,monospace;letter-spacing:2px;text-anchor:middle}.hud-active .progress{stroke-dasharray:1000 1003;filter:drop-shadow(0 0 10px #4bafff)}.thinking .accent{animation-duration:3s}.thinking .accent-dot{filter:drop-shadow(0 0 9px #ff9d00)}.speaking .brand{animation:speakPulse .55s ease-in-out infinite alternate}.speaking .progress{filter:drop-shadow(0 0 12px #4bafff)}
#reply{height:24px;max-width:min(80vw,650px);margin:-12px 0 12px;color:#a4d9ed;font:12px/24px ui-monospace,monospace;letter-spacing:.08em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 9px rgba(95,216,255,.35)}#reply:after{content:"";display:inline-block;height:12px;border-right:1px solid var(--cyan);vertical-align:-2px;animation:blink 1s steps(2) infinite}
#brain{position:absolute;inset:0;opacity:0;transform:scale(.88);pointer-events:none;transition:opacity .9s ease,transform .9s ease;background:radial-gradient(ellipse at center,rgba(50,29,8,.1),transparent 64%)}#brain canvas{width:100%;height:100%;display:block}body.brain-mode{--cyan:#ffcf75;--blue:#ffd98a;--ink:#ffe3a3}body.brain-mode:before{background-image:linear-gradient(rgba(234,169,64,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(234,169,64,.035) 1px,transparent 1px)}body.brain-mode #hud{opacity:0;transform:scale(1.12);pointer-events:none}body.brain-mode #brain{opacity:1;transform:scale(1);pointer-events:auto}body.brain-mode #reply{color:#f5d18b;text-shadow:0 0 9px rgba(255,180,46,.4)}body.brain-mode .led{background:#ffb42e;box-shadow:0 0 10px #ffb42e}body.brain-mode header{color:#d2a967}
#brain-title{position:absolute;top:16%;width:100%;text-align:center;color:#f8d99d;font:10px ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;text-shadow:0 0 12px #ba7518;pointer-events:none}#brain-hint{position:absolute;bottom:17%;width:100%;text-align:center;color:rgba(255,218,155,.58);font:9px ui-monospace,monospace;letter-spacing:.2em;pointer-events:none}
#command{position:fixed;z-index:5;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));height:56px;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 17px;border:1px solid rgba(91,177,207,.34);background:var(--glass);box-shadow:0 8px 35px #0008,inset 0 0 18px rgba(27,99,128,.08);backdrop-filter:blur(14px);border-radius:5px;transition:border-color .5s}body.brain-mode #command{border-color:rgba(255,180,46,.5)}#command.confirming #wake{display:none}#prompt{color:var(--cyan);font:12px ui-monospace,monospace}#input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#effaff;font:14px system-ui,sans-serif;letter-spacing:.03em}#input::placeholder{color:#608395}.btn{height:38px;min-width:42px;border:1px solid rgba(95,216,255,.3);border-radius:3px;background:rgba(16,53,70,.45);color:#bceeff;cursor:pointer;font:11px ui-monospace,monospace;letter-spacing:.1em}.btn:hover,.btn:focus-visible{outline:0;border-color:var(--cyan);box-shadow:0 0 12px rgba(95,216,255,.23)}#send{padding:0 15px;background:rgba(28,108,141,.27)}#mic{font-size:16px}#mic[aria-pressed=true]{color:#fff;border-color:#ff6262;box-shadow:0 0 13px #f44}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes speakPulse{to{filter:drop-shadow(0 0 17px rgba(95,216,255,1));fill:#fff}}
@media(max-height:500px){#app{padding-top:10px;padding-bottom:78px}#hud{width:min(66vmin,70vw,520px)}#reply{margin-bottom:4px}}
@media(max-width:380px){#command{gap:3px;padding:5px 6px}.btn{min-width:31px;padding:0 6px;font-size:9px}#input{font-size:12px}#wake{letter-spacing:0}}
@media(max-width:560px){header{font-size:9px}#hud{width:min(88vw,78vmin)}#command{height:52px;gap:5px;padding-left:11px}#prompt{font-size:10px}#send{padding:0 10px}.btn{min-width:37px;height:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
<header><span>Stark Industries <span aria-hidden="true">/</span> Interface</span><span class="live"><i class="led"></i><span id="status">Systems idle</span></span></header>
<section id="hud" aria-label="J.A.R.V.I.S. heads-up display"><svg viewBox="0 0 600 600" role="img" aria-label="Cyan circular science fiction HUD">
<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle class="outer" cx="300" cy="300" r="285"/>

<g id="segments"></g><circle class="progress" cx="300" cy="300" r="215" transform="rotate(-90 300 300)"/>
<circle class="accent" cx="300" cy="300" r="190" transform="rotate(-55 300 300)"/>
<circle class="accent-dot" cx="490" cy="300" r="2.3"/><circle class="accent-dot" cx="463" cy="380" r="2.3"/><circle class="accent-dot" cx="410" cy="447" r="2.3"/>
<circle class="inner" cx="300" cy="300" r="169"/><circle class="dash" cx="300" cy="300" r="153"/>
<circle class="center" cx="300" cy="300" r="137"/>
<g class="gear"><circle cx="300" cy="300" r="103"/><circle cx="300" cy="300" r="86"/><path d="M300 194v212M194 300h212M225 225l150 150m0-150L225 375"/><path d="M300 213l9 20 22-10-2 24 24 2-11 20 18 15-21 11 7 23-24-3-7 23-17-17-18 16-8-23-24 2 8-23-20-12 18-15-11-20 24-2-1-24 21 10z"/></g>
<path class="bar" d="M184 288h53M363 288h53"/><text class="brand" x="300" y="308">J.A.R.V.I.S.</text><text class="small-label" x="300" y="329">PERSONAL ASSISTANT</text>
</svg></section>
<div id="reply" aria-live="polite">Awaiting your command.</div>
<section id="brain" aria-label="Knowledge brain visualization"><canvas id="brain-canvas"></canvas><div id="brain-title">Knowledge Matrix</div><div id="brain-hint">DRAG TO ROTATE &nbsp;·&nbsp; SAY “HIDE BRAIN” TO RETURN</div></section>
</main>
<form id="command" autocomplete="off"><span id="prompt">&gt;</span><input id="input" aria-label="Command" placeholder="Enter a command..."/><button class="btn" id="wake" type="button" aria-pressed="false" title="Toggle the optional Jarvis wake word">WAKE</button><button class="btn" id="mute" type="button" aria-pressed="false" title="Toggle spoken replies">SOUND</button><button class="btn" id="mic" type="button" aria-label="Start voice input" title="Voice input" hidden>◉</button><button class="btn" id="send" type="submit">SEND</button><button class="btn" id="proceed" type="button" hidden>YES</button><button class="btn" id="cancel" type="button" hidden>NO</button></form>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ticks=$('#ticks'),segments=$('#segments'),app=$('#app'),canvas=$('#brain-canvas'),ctx=canvas.getContext('2d');
for(let i=0;i<120;i++){const a=i*Math.PI*2/120,r1=i%10===0?264:268,r2=i%10===0?251:258,l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',300+Math.cos(a)*r1);l.setAttribute('y1',300+Math.sin(a)*r1);l.setAttribute('x2',300+Math.cos(a)*r2);l.setAttribute('y2',300+Math.sin(a)*r2);ticks.append(l)}
for(let i=0;i<30;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','seg');c.setAttribute('cx','300');c.setAttribute('cy','300');c.setAttribute('r','215');c.setAttribute('stroke-dasharray','34 1317');c.setAttribute('transform',`rotate(${i*12} 300 300)`);segments.append(c)}
const rand=(a,b)=>a+Math.random()*(b-a),sphere=Array.from({length:1500},()=>{const y=rand(-1,1),t=rand(0,Math.PI*2),q=Math.sqrt(1-y*y);return{x:q*Math.cos(t),y,z:q*Math.sin(t),s:rand(.55,1.65)}}),shards=Array.from({length:500},()=>{const y=rand(-1,1),t=rand(0,Math.PI*2),q=Math.sqrt(1-y*y);return{x:q*Math.cos(t),y,z:q*Math.sin(t),a:rand(.012,.05),b:rand(-.025,.025),s:rand(.65,1.35)}}),inner=Array.from({length:500},(_,i)=>({t:i*.105,r:rand(.55,.8),w:rand(-.025,.025)})),arcs=Array.from({length:14},(_,i)=>({tilt:rand(0,Math.PI*2),phase:i*Math.PI/14,len:rand(1.6,4.6)}));
let W=0,H=0,dpr=1,rotY=0,rotX=.26,drag=null,frame=0,last=performance.now(),nodes=[],positions=[],selectedNode=null,pendingAction=null,recognition=null,typeTimer=null,speaking=false,wakeEnabled=false,muted=false,timerHandle=null;
try{muted=localStorage.getItem('jarvis-muted')==='true'}catch(_){};$('#mute').textContent=muted?'MUTED':'SOUND';
function setStatus(s){$('#status').textContent=s}
function say(line){clearInterval(typeTimer);const out=$('#reply');out.textContent='';if(!line)return;let i=0;typeTimer=setInterval(()=>{out.textContent=line.slice(0,++i);if(i>=line.length)clearInterval(typeTimer)},18)}
function setNodes(list){nodes=Array.isArray(list)?list.map((n,i)=>{if(Number.isFinite(n.x)&&Number.isFinite(n.y)&&Number.isFinite(n.z))return n;const y=1-2*(i+.5)/Math.max(1,list.length),t=i*2.3999632297,q=Math.sqrt(1-y*y);return{...n,x:q*Math.cos(t),y,z:q*Math.sin(t)}}):[];draw(performance.now())}
async function loadKnowledge(consume=false){try{const r=await fetch(`/api/knowledge${consume?'?consume=1':''}`);if(!r.ok)throw Error('knowledge unavailable');const data=await r.json();setNodes(data.nodes)}catch(_){}}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw(performance.now())}new ResizeObserver(resize).observe(canvas);resize();
function project(p,scale,cx,cy){let x=p.x*Math.cos(rotY)-p.z*Math.sin(rotY),z=p.x*Math.sin(rotY)+p.z*Math.cos(rotY),y=p.y*Math.cos(rotX)-z*Math.sin(rotX);z=p.y*Math.sin(rotX)+z*Math.cos(rotX);const k=3.2/(3.2-z);return{x:cx+x*scale*k,y:cy+y*scale*k,z,k}}
function draw(now){ctx.clearRect(0,0,W,H);positions=[];if(!document.body.classList.contains('brain-mode')||!W||!H)return;const cx=W/2,cy=H/2,r=Math.min(W,H)*.265,halo=ctx.createRadialGradient(cx,cy,r*.12,cx,cy,r*1.35);halo.addColorStop(0,'rgba(255,173,52,.045)');halo.addColorStop(.7,'rgba(255,147,25,.018)');halo.addColorStop(1,'rgba(255,147,25,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.4,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='lighter';
for(const arc of arcs){ctx.beginPath();for(let j=0;j<=100;j++){const t=arc.phase-arc.len/2+arc.len*j/100,v=project({x:Math.cos(t),y:Math.sin(t)*Math.cos(arc.tilt),z:Math.sin(t)*Math.sin(arc.tilt)},r,cx,cy);if(j===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y)}ctx.strokeStyle='rgba(255,186,75,.19)';ctx.lineWidth=.65;ctx.stroke()}
for(const p of inner){const t=p.t+rotY*.45,rr=p.r+p.w,v=project({x:rr*Math.cos(t),y:rr*Math.sin(t)*.32+Math.sin(t*2)*.018,z:rr*Math.sin(t)*.78},r,cx,cy);ctx.fillStyle=`rgba(255,190,92,${.15+.48*Math.max(0,(v.z+1)/2)})`;ctx.fillRect(v.x,v.y,1.35,1.35)}
for(const p of shards){const v=project(p,r,cx,cy);if(v.z<-.48)continue;ctx.strokeStyle=`rgba(255,${Math.round(158+75*(v.z+1)/2)},${Math.round(48+95*(v.z+1)/2)},${(.09+.45*(v.z+1)/2)*v.k})`;ctx.lineWidth=p.s;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.lineTo(v.x+(p.a*-.4+p.b)*r*v.k,v.y+p.a*r*v.k);ctx.stroke()}
for(const p of sphere){const v=project(p,r,cx,cy),depth=(v.z+1)/2;ctx.fillStyle=depth>.72?`rgba(255,241,194,${(.12+.72*depth)*Math.min(1,v.k)})`:depth>.35?`rgba(255,217,138,${(.12+.72*depth)*Math.min(1,v.k)*.84})`:`rgba(255,157,0,${(.12+.72*depth)*Math.min(1,v.k)*.52})`;const s=p.s*(.6+.7*depth);ctx.fillRect(v.x,v.y,s,s)}
ctx.font='10px ui-monospace,monospace';ctx.textAlign='left';for(const n of nodes){const v=project(n,r,cx,cy);positions.push({node:n,x:v.x,y:v.y,z:v.z});if(v.z<.12)continue;const chosen=n.id===selectedNode,flashing=n.flash&&(reduced||Math.sin(now/95)>-.15);ctx.fillStyle=chosen||flashing?'#fff7d5':`rgba(255,239,188,${.65+Math.min(.3,v.z*.25)})`;ctx.shadowColor=chosen||flashing?'#fff0b0':'#ffb42e';ctx.shadowBlur=chosen||flashing?22:9;ctx.beginPath();ctx.arc(v.x,v.y,(chosen?4.5:2.5)+v.z,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(v.z>.54){ctx.fillStyle=chosen?'#fff7d5':`rgba(255,224,160,${Math.min(1,(v.z-.42)*2.5)})`;ctx.fillText(n.name,v.x+7,v.y-5)}}ctx.globalCompositeOperation='source-over'}
function animate(now){frame=0;if(!document.body.classList.contains('brain-mode'))return;if(!reduced&&!drag){const dt=Math.min(.05,(now-last)/1000);rotY+=dt*.075}last=now;draw(now);if(!reduced&&!drag)frame=requestAnimationFrame(animate)}
function startBrainRender(){if(frame)cancelAnimationFrame(frame);last=performance.now();animate(last)}
function stopBrainRender(){if(frame)cancelAnimationFrame(frame);frame=0;draw(performance.now())}
function brainCommand(t){return /^(?:show brain|open (?:the )?brain|show (?:your )?knowledge brain|brain)[.!?]*$/i.test(t.trim())}
function hideCommand(t){return /^(?:hide brain|back|interface)[.!?]*$/i.test(t.trim())}
function showBrain(message=true){document.body.classList.add('brain-mode');setStatus('Knowledge mode');loadKnowledge(true);startBrainRender();if(message)say('Knowledge brain online, sir.')}
function hideBrain(message=true){document.body.classList.remove('brain-mode');app.classList.remove('hud-active');setStatus('Systems idle');stopBrainRender();if(message)say('Interface restored, sir.')}
function speak(text){if(muted||!('speechSynthesis'in window)||!text)return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.rate=1;utterance.onstart=()=>{speaking=true;app.classList.add('hud-active','speaking')};utterance.onboundary=()=>{app.classList.remove('speaking');void app.offsetWidth;app.classList.add('speaking')};utterance.onend=utterance.onerror=()=>{speaking=false;app.classList.remove('speaking','hud-active')};speechSynthesis.speak(utterance)}
function showConfirmation(action){pendingAction=action;$('#command').classList.add('confirming');$('#proceed').hidden=false;$('#cancel').hidden=false;}
function clearConfirmation(){pendingAction=null;$('#command').classList.remove('confirming');$('#proceed').hidden=true;$('#cancel').hidden=true;}
function approvePending(){if(!pendingAction)return;const action=pendingAction;clearConfirmation();const opened=window.open('about:blank','_blank');if(opened){opened.opener=null;opened.location=action.url;say('Opened in a new tab, sir.');setStatus('Systems idle')}else{say('Your browser blocked the new tab, sir. Use the link: '+action.url);setStatus('Action blocked')}}
function cancelPending(){if(!pendingAction)return;clearConfirmation();say('Understood. I cancelled that action, sir.')}
function startTimer(seconds){clearTimeout(timerHandle);say('Timer started, sir.');setStatus('Timer active');timerHandle=setTimeout(()=>{setStatus('Systems idle');say('Your timer is complete, sir.');speak('Your timer is complete, sir.')},seconds*1000)}
async function process(text,source='typed'){
 let clean=text.trim();if(/^hey\s+jarvis\b/i.test(clean))clean=clean.replace(/^hey\s+jarvis[\s,.:;-]*/i,'');else if(/^jarvis\b/i.test(clean))clean=clean.replace(/^jarvis[\s,.:;-]*/i,'');if(!clean)return;
 if(brainCommand(clean)){clearConfirmation();showBrain();return}
 if(hideCommand(clean)){clearConfirmation();hideBrain();return}
 if(pendingAction){if(/^(?:yes|yes sir|proceed|go ahead)[.! ]*$/i.test(clean)){approvePending();return}if(/^(?:no|no sir|cancel|stop)[.! ]*$/i.test(clean)){cancelPending();return}}
 if(document.body.classList.contains('brain-mode'))hideBrain(false);
 app.classList.add('thinking');setStatus('Processing');say('');
 try{const response=await fetch('/api/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean})});const data=await response.json();say(data.reply||'I have no reply, sir.');if(data.action?.type==='show_brain')showBrain(false);if(data.action?.type==='hide_brain')hideBrain(false);if(data.confirmation)showConfirmation(data.confirmation);if(data.timer_seconds)startTimer(data.timer_seconds);if(data.nodes)setNodes(data.nodes);if(data.highlight){selectedNode=data.highlight;draw(performance.now())}if(data.unavailable)setStatus('AI offline');else if(!data.timer_seconds)setStatus('Systems idle');if(data.speak)speak(data.reply)}catch(_){say("I'm having trouble reaching my AI service, sir. Please check the local server and your internet connection.");setStatus('AI offline')}finally{app.classList.remove('thinking')}
}
$('#command').addEventListener('submit',e=>{e.preventDefault();const value=$('#input').value.trim();if(!value)return;$('#input').value='';process(value)});
$('#proceed').addEventListener('click',approvePending);$('#cancel').addEventListener('click',cancelPending);
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'MUTED':'SOUND';try{localStorage.setItem('jarvis-muted',String(muted))}catch(_){}if(muted&&'speechSynthesis'in window)speechSynthesis.cancel();say(muted?'Voice replies muted, sir.':'Voice replies enabled, sir.')});
$('#wake').addEventListener('click',()=>{wakeEnabled=!wakeEnabled;$('#wake').setAttribute('aria-pressed',String(wakeEnabled));$('#wake').textContent=wakeEnabled?'WAKE ON':'WAKE';say(wakeEnabled?'Wake word enabled. Say Jarvis before a command, sir.':'Wake word disabled, sir.')});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>3)drag.moved=true;if(drag.moved){rotY+=dx*.008;rotX=Math.max(-1.1,Math.min(1.1,rotX+dy*.008));drag.x=e.clientX;drag.y=e.clientY;draw(performance.now())}});canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(!moved){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let nearest=null,distance=15;for(const p of positions){if(p.z<=.12)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<distance){nearest=p;distance=d}}if(nearest){selectedNode=nearest.node.id;say(`${nearest.node.name}: ${nearest.node.note}`);draw(performance.now())}}if(!reduced&&document.body.classList.contains('brain-mode')){last=performance.now();frame=requestAnimationFrame(animate)}});canvas.addEventListener('pointercancel',()=>{drag=null;if(!reduced&&document.body.classList.contains('brain-mode'))frame=requestAnimationFrame(animate)});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.continuous=true;recognition.onstart=()=>{$('#mic').setAttribute('aria-pressed','true');app.classList.add('hud-active');setStatus(wakeEnabled?'Listening for Jarvis':'Listening')};recognition.onend=()=>{$('#mic').setAttribute('aria-pressed','false');app.classList.remove('hud-active');if(['Listening','Listening for Jarvis'].includes($('#status').textContent))setStatus('Systems idle')};recognition.onerror=()=>{say('I could not access voice input, sir. Check the browser microphone permission.');setStatus('Voice unavailable')};recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;let text=e.results[i][0].transcript.trim();if(wakeEnabled){if(!/\bjarvis\b/i.test(text))continue;text=text.replace(/^.*?\bjarvis\b[\s,.:;-]*/i,'').trim();if(!text){say('At your service, sir.');continue}}$('#input').value=text;process(text,'voice')}};$('#mic').hidden=false;$('#mic').addEventListener('click',()=>{if($('#mic').getAttribute('aria-pressed')==='true'){recognition.stop();return}try{recognition.start()}catch(_){recognition.stop()}})}else{$('#mic').title='Voice input is not supported by this browser';$('#wake').hidden=true}
if(!('speechSynthesis'in window))$('#mute').hidden=true;
loadKnowledge(false);
})();
