<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070d">
<title>J.A.R.V.I.S. Interface</title>
<style>
:root{color-scheme:dark;--bg:#02070d;--cyan:#5fd8ff;--blue:#7cc4ff;--gold:#ffd98a;--ink:#b8d7e5;--glass:rgba(5,16,26,.86)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background-color:var(--bg);color:#eaf8ff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(66,185,227,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(66,185,227,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 15%,transparent 90%);z-index:0}
#app{height:100%;min-height:360px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;padding:clamp(14px,3vh,28px) 18px 94px;transition:color .5s}header{width:min(100%,1000px);display:flex;justify-content:space-between;align-items:center;color:#86b8ce;font:11px/1.2 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}.live{display:flex;gap:9px;align-items:center}.led{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 10px var(--cyan)}
#hud{width:min(78vmin,78vw,720px);aspect-ratio:1;margin:auto;display:grid;place-items:center;opacity:1;transform:scale(1);transition:opacity .9s ease,transform .9s ease;filter:drop-shadow(0 0 16px rgba(33,151,208,.1))}#hud svg{width:100%;height:100%;overflow:visible}.outer{fill:none;stroke:#1d9bd6;stroke-width:1.25;stroke-dasharray:92 13 42 11 165 18;transform-origin:300px 300px;animation:spin 90s linear infinite}.ticks{stroke:#5fd8ff;stroke-width:1.3;opacity:.68;transform-origin:300px 300px;animation:spin 120s linear infinite reverse}.seg{fill:none;stroke:#356486;stroke-width:12;stroke-linecap:butt;opacity:.65}.progress{fill:none;stroke:#7cc4ff;stroke-width:12;stroke-linecap:butt;stroke-dasharray:710 1293;filter:drop-shadow(0 0 5px #4bafff);transition:stroke-dasharray .8s,filter .4s}.accent{fill:none;stroke:#ffb42e;stroke-width:2;stroke-dasharray:82 1112;stroke-linecap:round;transform-origin:300px 300px;animation:spin 24s linear infinite}.accent-dot{fill:#ffb42e;filter:drop-shadow(0 0 4px #ff9d00)}.inner{fill:none;stroke:#71c9e8;stroke-width:1;opacity:.42}.dash{fill:none;stroke:#65d4fb;stroke-width:1;stroke-dasharray:2 8;opacity:.5;transform-origin:300px 300px;animation:spin 55s linear infinite reverse}.center{fill:rgba(3,12,20,.9);stroke:#1d7299;stroke-width:1}.gear{fill:none;stroke:#53b6d9;stroke-width:.7;opacity:.13}.brand{fill:#f4fbff;font:700 24px/1 system-ui,sans-serif;letter-spacing:6px;text-anchor:middle;filter:drop-shadow(0 0 7px rgba(95,216,255,.85))}.bar{stroke:#5fd8ff;stroke-width:1.3;opacity:.78}.small-label{fill:#69abc2;font:7px ui-monospace,monospace;letter-spacing:2px;text-anchor:middle}.hud-active .progress{stroke-dasharray:1000 1003;filter:drop-shadow(0 0 10px #4bafff)}.thinking .accent{animation-duration:3s}.thinking .accent-dot{filter:drop-shadow(0 0 9px #ff9d00)}
#reply{height:24px;max-width:min(80vw,650px);margin:-12px 0 12px;color:#a4d9ed;font:12px/24px ui-monospace,monospace;letter-spacing:.08em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 9px rgba(95,216,255,.35)}#reply:after{content:"";display:inline-block;height:12px;border-right:1px solid var(--cyan);vertical-align:-2px;animation:blink 1s steps(2) infinite}
#brain{position:absolute;inset:0;opacity:0;transform:scale(.88);pointer-events:none;transition:opacity .9s ease,transform .9s ease;background:radial-gradient(ellipse at center,rgba(50,29,8,.1),transparent 64%)}#brain canvas{width:100%;height:100%;display:block}body.brain-mode{--cyan:#ffcf75;--blue:#ffd98a;--ink:#ffe3a3}body.brain-mode:before{background-image:linear-gradient(rgba(234,169,64,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(234,169,64,.035) 1px,transparent 1px)}body.brain-mode #hud{opacity:0;transform:scale(1.12);pointer-events:none}body.brain-mode #brain{opacity:1;transform:scale(1);pointer-events:auto}body.brain-mode #reply{color:#f5d18b;text-shadow:0 0 9px rgba(255,180,46,.4)}body.brain-mode .led{background:#ffb42e;box-shadow:0 0 10px #ffb42e}body.brain-mode header{color:#d2a967}
#brain-title{position:absolute;top:16%;width:100%;text-align:center;color:#f8d99d;font:10px ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;text-shadow:0 0 12px #ba7518;pointer-events:none}#brain-hint{position:absolute;bottom:17%;width:100%;text-align:center;color:rgba(255,218,155,.58);font:9px ui-monospace,monospace;letter-spacing:.2em;pointer-events:none}
#command{position:fixed;z-index:5;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));height:56px;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 17px;border:1px solid rgba(91,177,207,.34);background:var(--glass);box-shadow:0 8px 35px #0008,inset 0 0 18px rgba(27,99,128,.08);backdrop-filter:blur(14px);border-radius:5px;transition:border-color .5s}body.brain-mode #command{border-color:rgba(255,180,46,.5)}#prompt{color:var(--cyan);font:12px ui-monospace,monospace}#input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#effaff;font:14px system-ui,sans-serif;letter-spacing:.03em}#input::placeholder{color:#608395}.btn{height:38px;min-width:42px;border:1px solid rgba(95,216,255,.3);border-radius:3px;background:rgba(16,53,70,.45);color:#bceeff;cursor:pointer;font:11px ui-monospace,monospace;letter-spacing:.1em}.btn:hover,.btn:focus-visible{outline:0;border-color:var(--cyan);box-shadow:0 0 12px rgba(95,216,255,.23)}#send{padding:0 15px;background:rgba(28,108,141,.27)}#mic{font-size:16px}#mic[aria-pressed=true]{color:#fff;border-color:#ff6262;box-shadow:0 0 13px #f44}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
@media(max-width:560px){header{font-size:9px}#hud{width:min(88vw,78vmin)}#command{height:52px;gap:5px;padding-left:11px}#prompt{font-size:10px}#send{padding:0 10px}.btn{min-width:37px;height:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

:root{--accent:.55;--panel-border:rgba(91,177,207,.38)}
.btn{padding:0 10px;font:10px ui-monospace,monospace;letter-spacing:.08em}
#settings-toggle{width:32px;height:30px;min-width:32px;padding:0;margin-left:10px}
#file-open{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:86px}
#settings-panel{position:fixed;z-index:8;right:max(14px,calc((100vw - 760px)/2));bottom:88px;width:min(410px,calc(100vw - 28px));max-height:min(72vh,660px);overflow:auto;padding:18px;border:1px solid var(--panel-border);border-radius:7px;background:rgba(3,13,22,.96);box-shadow:0 14px 50px #000b;backdrop-filter:blur(18px);color:#d9eff8}
#settings-panel h2{margin:0 0 12px;font:600 12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(144,193,209,.1);font-size:12px}.setting small{display:block;color:#7195a4;font-size:10px;margin-top:2px}.setting input[type=range]{width:120px;accent-color:var(--cyan)}.setting input[type=text],.setting select{width:min(190px,45vw);padding:7px;border:1px solid #315565;border-radius:3px;background:#07131d;color:#eaf8ff}.setting input[type=checkbox]{accent-color:var(--cyan);width:16px;height:16px}.settings-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.settings-actions .btn{flex:1}#settings-message{min-height:18px;color:#8eb9c9;font:10px ui-monospace,monospace;margin-top:8px}
body.brain-mode #settings-panel{border-color:rgba(255,180,46,.45)}
body.brain-mode #brain-hint{color:rgba(255,218,155,.7)}
body.booting .outer{stroke-dashoffset:1800;animation:ringDraw .55s ease .05s forwards}body.booting .ticks{opacity:0;animation:appear .3s ease .5s forwards}body.booting #segments .seg{stroke-dasharray:0 1351;opacity:0;animation:segmentDraw .45s ease var(--delay) forwards}body.booting .accent{stroke-dasharray:0 1194;animation:arcDraw .35s ease 1.9s forwards}body.booting .inner,body.booting .dash{opacity:0;animation:appear .3s ease 2.15s forwards}body.booting .brand,body.booting .small-label,body.booting .bar{opacity:0;animation:fadeIn .42s ease 2.5s forwards}body.booting #reply{opacity:0}body.booting #settings-panel{display:none!important}
@keyframes ringDraw{to{stroke-dashoffset:0}}@keyframes appear{to{opacity:.7}}@keyframes fadeIn{to{opacity:1}}@keyframes segmentDraw{to{stroke-dasharray:34 1317;opacity:.9}}@keyframes arcDraw{to{stroke-dasharray:82 1112}}
body.page-hidden .outer,body.page-hidden .ticks,body.page-hidden .accent,body.page-hidden .dash{animation-play-state:paused!important}
@media(max-height:500px){#settings-panel{max-height:68vh}}

</style>
</head>
<body class="booting">
<main id="app">
<header><span>Stark Industries <span aria-hidden="true">/</span> Interface</span><span class="live"><i class="led"></i><span id="status">Systems idle</span><button class="btn" id="settings-toggle" type="button" aria-expanded="false" aria-label="Open settings">⚙</button></span></header>
<section id="hud" aria-label="J.A.R.V.I.S. heads-up display"><svg viewBox="0 0 600 600" role="img" aria-label="Cyan circular science fiction HUD">
<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle class="outer" cx="300" cy="300" r="285"/>
<g class="ticks" id="ticks"></g>
<circle class="seg" cx="300" cy="300" r="215"/>
<g id="segments"></g><circle id="progress-band" class="progress" cx="300" cy="300" r="215" transform="rotate(-90 300 300)"/>
<circle class="accent" cx="300" cy="300" r="190" transform="rotate(-55 300 300)"/>
<circle class="accent-dot" cx="490" cy="300" r="2.3"/><circle class="accent-dot" cx="463" cy="380" r="2.3"/><circle class="accent-dot" cx="410" cy="447" r="2.3"/>
<circle class="inner" cx="300" cy="300" r="169"/><circle class="dash" cx="300" cy="300" r="153"/>
<circle class="center" cx="300" cy="300" r="137"/>
<g class="gear"><circle cx="300" cy="300" r="103"/><circle cx="300" cy="300" r="86"/><path d="M300 194v212M194 300h212M225 225l150 150m0-150L225 375"/><path d="M300 213l9 20 22-10-2 24 24 2-11 20 18 15-21 11 7 23-24-3-7 23-17-17-18 16-8-23-24 2 8-23-20-12 18-15-11-20 24-2-1-24 21 10z"/></g>
<path class="bar" d="M184 288h53M363 288h53"/><text class="brand" x="300" y="308">J.A.R.V.I.S.</text><text class="small-label" x="300" y="329">PERSONAL ASSISTANT</text>
</svg></section>
<div id="reply" aria-live="polite">Systems online, sir.</div><button class="btn" id="file-open" type="button" hidden>OPEN FILE</button>
<section id="brain" aria-label="Knowledge brain visualization"><canvas id="brain-canvas"></canvas><div id="brain-title">Knowledge Matrix</div><div id="brain-hint">drag to rotate - say 'back' to return</div></section>
</main>
<aside id="settings-panel" hidden aria-label="Settings">
<h2>Interface settings</h2>
<label class="setting"><span>Sound effects</span><input id="set-sound" type="checkbox"></label>
<label class="setting"><span>Voice replies and input</span><input id="set-voice" type="checkbox"></label>
<label class="setting"><span>Voice speed</span><input id="set-speed" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>
<label class="setting"><span>Reduce motion</span><input id="set-motion" type="checkbox"></label>
<label class="setting"><span>Brain particle density</span><select id="set-density"><option>low</option><option selected>medium</option><option>high</option></select></label>
<label class="setting"><span>Accent intensity</span><input id="set-accent" type="range" min="0" max="1" step="0.05" value="0.55"></label>
<label class="setting"><span>Share knowledge with AI<small>Off keeps document excerpts local.</small></span><input id="set-share" type="checkbox"></label>
<label class="setting"><span>Knowledge folder</span><input id="set-knowledge-dir" type="text" value="knowledge"></label>
<div class="settings-actions"><button class="btn" id="save-settings" type="button">SAVE</button><button class="btn" id="index-now" type="button">INDEX NOW</button></div>
<div id="settings-message" role="status"></div>
</aside>
<form id="command" autocomplete="off"><span id="prompt">&gt;</span><input id="input" aria-label="Command" placeholder="Enter a command..."/><button class="btn" id="wake" type="button" aria-pressed="false">WAKE</button><button class="btn" id="mic" type="button" aria-label="Start voice input" title="Voice input" hidden>◉</button><button class="btn" id="send" type="submit">SEND</button><button class="btn" id="proceed" type="button" hidden>YES</button><button class="btn" id="cancel" type="button" hidden>NO</button></form>
<script>

(()=>{'use strict';
const $=s=>document.querySelector(s),app=$('#app'),canvas=$('#brain-canvas'),ctx=canvas.getContext('2d'),reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
const ticks=$('#ticks'),segments=$('#segments'),settingsPanel=$('#settings-panel'),command=$('#command'),input=$('#input');
const circumference=2*Math.PI*215,settings={sound_enabled:false,voice_enabled:false,voice_speed:1,reduce_motion:false,particle_density:'medium',accent_intensity:.55,share_knowledge:false,knowledge_dir:'knowledge'};
let reduced=reducedQuery.matches,settingsReady=false,bootFinished=false,bootTimer=null,bootStarted=performance.now(),typeTimer=null,settingsOpen=false,recognition=null,wakeEnabled=false,muted=false,pendingAction=null,selectedNode=null,activeSources=new Set(),nodes=[],links=[],positions=[],W=0,H=0,dpr=1,rotY=0,rotX=.26,drag=null,frame=0,lastFrame=0,brainProgress=0,brainTarget=false,brainVisible=false,frameTimes=[],densityIndex=1,particleCounts={low:[650,220,220],medium:[1500,500,500],high:[2300,760,720]},sphere=[],shards=[],inner=[],arcs=[],audioContext=null,playingAudio=null,activeObjectUrl=null,timerHandle=null,indexPoll=null,lastIndexRunning=false;
function setStatus(s){$('#status').textContent=s}
function cancelTyping(){if(typeTimer){clearInterval(typeTimer);typeTimer=null}}
function say(text){cancelTyping();const out=$('#reply');out.textContent='';if(!text)return;let i=0;typeTimer=setInterval(()=>{out.textContent=text.slice(0,++i);if(i>=text.length)cancelTyping()},18)}
function applySettings(){reduced=reducedQuery.matches||settings.reduce_motion;if(reduced&&!bootFinished)finishBoot(false);document.documentElement.style.setProperty('--accent',String(settings.accent_intensity));densityIndex=['low','medium','high'].indexOf(settings.particle_density);if(densityIndex<0)densityIndex=1;buildParticles();$('#set-sound').checked=settings.sound_enabled;$('#set-voice').checked=settings.voice_enabled;$('#set-speed').value=settings.voice_speed;$('#set-motion').checked=settings.reduce_motion;$('#set-density').value=settings.particle_density;$('#set-accent').value=settings.accent_intensity;$('#set-share').checked=settings.share_knowledge;$('#set-knowledge-dir').value=settings.knowledge_dir;configureVoice()}
async function loadSettings(){try{const r=await fetch('/api/settings');if(!r.ok)throw Error('settings');const data=await r.json();Object.assign(settings,data.settings||{});oldKnowledgeDir=settings.knowledge_dir;settingsReady=true;applySettings()}catch(_){try{Object.assign(settings,JSON.parse(localStorage.getItem('jarvis-settings')||'{}'))}catch(__){}applySettings();$('#settings-message').textContent='Settings server unavailable; using browser defaults.'}}
async function saveSettings(){const changes={sound_enabled:$('#set-sound').checked,voice_enabled:$('#set-voice').checked,voice_speed:Number($('#set-speed').value),reduce_motion:$('#set-motion').checked,particle_density:$('#set-density').value,accent_intensity:Number($('#set-accent').value),share_knowledge:$('#set-share').checked,knowledge_dir:$('#set-knowledge-dir').value.trim()};$('#settings-message').textContent='Saving settings...';try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(changes)});const data=await r.json();if(!r.ok)throw Error(data.reply||'Settings could not be saved.');Object.assign(settings,data.settings);settingsReady=true;const directoryChanged=changes.knowledge_dir!==oldKnowledgeDir;oldKnowledgeDir=changes.knowledge_dir;applySettings();try{localStorage.setItem('jarvis-settings',JSON.stringify(settings))}catch(_){}$('#settings-message').textContent='Settings saved, sir.';if(directoryChanged)startIndexing()}catch(_){$('#settings-message').textContent="I couldn't save those settings, sir. Check the local server."}}
let oldKnowledgeDir=settings.knowledge_dir;
function configureVoice(){const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);$('#mic').hidden=!settings.voice_enabled||!supported;$('#wake').hidden=!settings.voice_enabled||!supported;if(settings.voice_enabled&&supported&&!recognition)setupRecognition();if((!settings.voice_enabled||!supported)&&recognition){try{recognition.stop()}catch(_){}recognition=null}if(!supported)$('#mic').title='Voice input is not supported by this browser'}
function unlockAudio(){if(!settings.sound_enabled)return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume()}catch(_){}}
function tone(frequency,duration,volume=.035,wave='sine',endFrequency=null){if(!settings.sound_enabled)return;try{unlockAudio();if(!audioContext)return;const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type=wave;osc.frequency.setValueAtTime(frequency,now);if(endFrequency)osc.frequency.exponentialRampToValueAtTime(endFrequency,now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+duration+.03)}catch(_){}}
function sound(kind){if(!settings.sound_enabled)return;if(kind==='boot'){tone(523,.22,.025);setTimeout(()=>tone(659,.26,.023),100);setTimeout(()=>tone(784,.38,.02),210)}else if(kind==='whoosh')tone(230,.22,.018,'sine',620);else if(kind==='blip')tone(880,.08,.018)}
function finishBoot(skipped=false){if(bootFinished)return;bootFinished=true;clearTimeout(bootTimer);document.body.classList.remove('booting');setStatus('Systems idle');say('Systems online, sir.');if(skipped)sound('boot')}
function skipBoot(){if(bootFinished)return;unlockAudio();finishBoot(true)}
function startBoot(){if(reduced){finishBoot(false);return}document.addEventListener('pointerdown',skipBoot,{once:true});document.addEventListener('keydown',skipBoot,{once:true});bootTimer=setTimeout(()=>finishBoot(false),3000)}
function makeSpherePoint(){const y=Math.random()*2-1,t=Math.random()*Math.PI*2,q=Math.sqrt(1-y*y);return{x:q*Math.cos(t),y,z:q*Math.sin(t)}}
function buildParticles(){const level=['low','medium','high'][densityIndex]||'medium',[a,b,c]=particleCounts[level];sphere=Array.from({length:a},()=>({...makeSpherePoint(),s:.55+Math.random()*1.1}));shards=Array.from({length:b},()=>({...makeSpherePoint(),a:.012+Math.random()*.04,b:(Math.random()-.5)*.05,s:.65+Math.random()*.7}));inner=Array.from({length:c},(_,i)=>({t:i*.105,r:.55+Math.random()*.25,w:(Math.random()-.5)*.05}));arcs=Array.from({length:14},(_,i)=>({tilt:Math.random()*Math.PI*2,phase:i*Math.PI/14,len:1.6+Math.random()*3}))}
function resize(){try{const rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw(performance.now())}catch(_){}}
new ResizeObserver(resize).observe(canvas);resize();
function setNodes(list,edgeList=[]){nodes=Array.isArray(list)?list.map((n,i)=>{if(Number.isFinite(n.x)&&Number.isFinite(n.y)&&Number.isFinite(n.z))return n;const y=1-2*(i+.5)/Math.max(1,list.length),t=i*2.3999632297,q=Math.sqrt(1-y*y);return{...n,x:q*Math.cos(t),y,z:q*Math.sin(t)}}):[];links=Array.isArray(edgeList)?edgeList:[];draw(performance.now())}
async function loadKnowledge(consume=false){try{const r=await fetch(`/api/knowledge${consume?'?consume=1':''}`);if(!r.ok)throw Error('knowledge unavailable');const data=await r.json();setNodes(data.nodes,data.links)}catch(_){}}
function project(p,scale,cx,cy){let x=p.x*Math.cos(rotY)-p.z*Math.sin(rotY),z=p.x*Math.sin(rotY)+p.z*Math.cos(rotY),y=p.y*Math.cos(rotX)-z*Math.sin(rotX);z=p.y*Math.sin(rotX)+z*Math.cos(rotX);const k=3.2/(3.2-z);return{x:cx+x*scale*k,y:cy+y*scale*k,z,k}}
function draw(now){if(!ctx||!W||!H)return;ctx.clearRect(0,0,W,H);positions=[];if(!brainVisible&&brainProgress<=0)return;const cx=W/2,cy=H/2,ease=brainProgress*brainProgress*(3-2*brainProgress),r=Math.min(W,H)*.265*ease;if(r<.1)return;const halo=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r*1.4);halo.addColorStop(0,'rgba(255,173,52,.045)');halo.addColorStop(.7,'rgba(255,147,25,.018)');halo.addColorStop(1,'rgba(255,147,25,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.4,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='lighter';
const projected=new Map();for(const n of nodes){const v=project(n,r,cx,cy);projected.set(n.id,v);positions.push({node:n,...v})}
for(const edge of links){const a=projected.get(edge.source),b=projected.get(edge.target);if(!a||!b||a.z<-.1||b.z<-.1)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(255,190,92,${Math.min(.3,.07+Number(edge.weight||1)*.025)})`;ctx.lineWidth=.45+Math.min(1,Number(edge.weight||1)*.08);ctx.stroke()}
for(const arc of arcs){ctx.beginPath();for(let j=0;j<=90;j++){const t=arc.phase-arc.len/2+arc.len*j/90,v=project({x:Math.cos(t),y:Math.sin(t)*Math.cos(arc.tilt),z:Math.sin(t)*Math.sin(arc.tilt)},r,cx,cy);if(j===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y)}ctx.strokeStyle='rgba(255,186,75,.17)';ctx.lineWidth=.65;ctx.stroke()}

for(const p of shards){const v=project(p,r,cx,cy);if(v.z<-.48)continue;ctx.strokeStyle=`rgba(255,${Math.round(158+75*(v.z+1)/2)},${Math.round(48+95*(v.z+1)/2)},${(.08+.42*(v.z+1)/2)*v.k})`;ctx.lineWidth=p.s;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.lineTo(v.x+(p.a*-.4+p.b)*r*v.k,v.y+p.a*r*v.k);ctx.stroke()}

const pulse=(now/850)%Math.max(1,nodes.length);ctx.font='10px ui-monospace,monospace';ctx.textAlign='left';for(let i=0;i<nodes.length;i++){const n=nodes[i],v=projected.get(n.id);if(!v||v.z<.12)continue;const used=activeSources.has(n.id),travelling=document.body.classList.contains('thinking')?Math.max(0,1-Math.abs(i-pulse)):0,flashing=n.flash&&(reduced||Math.sin(now/95)>-.15),selected=n.id===selectedNode;const glow=used||flashing||selected||travelling>.35;ctx.fillStyle=glow?'#fff7d5':`rgba(255,239,188,${.58+Math.min(.32,v.z*.26)})`;ctx.shadowColor=glow?'#fff0b0':'#ffb42e';ctx.shadowBlur=glow?18:7;const radius=2.5+v.z+Math.min(4,Math.log2(1+Number(n.size||1))*.6);ctx.beginPath();ctx.arc(v.x,v.y,radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(v.z>.54){ctx.fillStyle=glow?'#fff7d5':`rgba(255,224,160,${Math.min(1,(v.z-.42)*2.5)})`;ctx.fillText(n.name,v.x+7,v.y-5)}}ctx.globalCompositeOperation='source-over'}
let lastAutoReduce=0;function finishBrainClose(){brainVisible=false;document.body.classList.remove('brain-mode','brain-closing');$('#file-open').hidden=true;frame=0;draw(performance.now())}
function frameLoop(now){frame=0;if(document.hidden||document.body.classList.contains('page-hidden'))return;const dt=lastFrame?Math.min(.1,(now-lastFrame)/1000):0;lastFrame=now;if(!reduced){brainProgress=brainTarget?Math.min(1,brainProgress+dt):Math.max(0,brainProgress-dt);if(dt>0){frameTimes.push(dt);if(frameTimes.length>30)frameTimes.shift();const avg=frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;if(frameTimes.length===30&&avg>.025&&now-lastAutoReduce>8000&&densityIndex>0){densityIndex--;settings.particle_density=['low','medium','high'][densityIndex];buildParticles();lastAutoReduce=now;say("I lowered brain detail to keep the display smooth, sir.")}}}else brainProgress=brainTarget?1:0;rotY+=(!reduced&&!drag&&brainVisible)?dt*.075:0;draw(now);if(!brainTarget&&brainProgress<=0){finishBrainClose();return}if(brainTarget||brainProgress>0){if(!reduced)frame=requestAnimationFrame(frameLoop);else if(!brainTarget)finishBrainClose()}}
function startBrainRender(){if(frame)cancelAnimationFrame(frame);frame=0;lastFrame=0;if(!reduced)frame=requestAnimationFrame(frameLoop);else{brainProgress=brainTarget?1:0;draw(performance.now());if(!brainTarget)finishBrainClose()}}
function showBrain(message=true){if(booting())finishBoot(true);if(brainVisible&&brainTarget)return;brainVisible=true;brainTarget=true;document.body.classList.add('brain-mode');document.body.classList.remove('brain-closing');sound('whoosh');setStatus('Knowledge mode');loadKnowledge(true);startBrainRender();if(message)say('Knowledge brain online, sir.')}
function hideBrain(message=true){if(!brainVisible)return;brainTarget=false;document.body.classList.add('brain-closing');sound('whoosh');$('#file-open').hidden=true;startBrainRender();if(message)say('Interface restored, sir.');setStatus('Systems idle')}
function booting(){return document.body.classList.contains('booting')}
function toggleBrain(){if(brainVisible)hideBrain();else showBrain()}
function setConfirmation(action){pendingAction=action;$('#proceed').hidden=false;$('#cancel').hidden=false;command.classList.add('confirming')}
function clearConfirmation(){pendingAction=null;$('#proceed').hidden=true;$('#cancel').hidden=true;command.classList.remove('confirming')}
async function approvePending(){if(!pendingAction)return;const action=pendingAction;if(action.type==='skill'){clearConfirmation();await askServer('yes sir');return}clearConfirmation();let url;if(action.type==='open_file')url='/api/open-file?path='+encodeURIComponent(action.path);else url=action.url;try{const tab=window.open('about:blank','_blank');if(tab){tab.opener=null;tab.location=url;say('Opened after your confirmation, sir.');setStatus('Systems idle')}else{say('Your browser blocked the new tab, sir. Please allow pop-ups and retry.');setStatus('Action blocked')}}catch(_){say("I couldn't open that item, sir. Please check the browser's pop-up settings.")}}
function cancelPending(){if(!pendingAction)return;clearConfirmation();askServer('no sir')}
async function speak(text){if(!settings.voice_enabled||!text)return;app.classList.add('hud-active','speaking');setStatus('Speaking');try{const response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,speed:settings.voice_speed})});if(!response.ok)throw Error('Fish Audio unavailable');const blob=await response.blob();activeObjectUrl=URL.createObjectURL(blob);playingAudio=new Audio(activeObjectUrl);playingAudio.onended=stopSpeaking;playingAudio.onerror=()=>{stopSpeaking();browserSpeak(text)};await playingAudio.play()}catch(_){browserSpeak(text)}}
function stopSpeaking(){if(playingAudio){playingAudio.onended=null;playingAudio.onerror=null;playingAudio=null}if(activeObjectUrl){URL.revokeObjectURL(activeObjectUrl);activeObjectUrl=null}app.classList.remove('speaking','hud-active');if($('#status').textContent==='Speaking')setStatus('Systems idle')}
function browserSpeak(text){if(!settings.voice_enabled||!('speechSynthesis'in window)){stopSpeaking();return}try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.rate=settings.voice_speed;utterance.onend=utterance.onerror=stopSpeaking;speechSynthesis.speak(utterance)}catch(_){stopSpeaking();say('Voice output is unavailable in this browser, sir.')}}
function playReplySound(){sound('blip')}
function startTimer(seconds){clearTimeout(timerHandle);say('Timer started, sir.');setStatus('Timer active');timerHandle=setTimeout(()=>{say('Your timer is complete, sir.');playReplySound();speak('Your timer is complete, sir.');setStatus('Systems idle')},seconds*1000)}
async function askServer(text){try{const response=await fetch('/api/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await response.json();handleResponse(data);return data}catch(_){say("I'm having trouble reaching the local assistant, sir. Check the server and internet connection.");setStatus('Service unavailable');return null}}
function handleResponse(data){say(data.reply||'I have no reply, sir.');playReplySound();if(data.action?.type==='show_brain')showBrain(false);if(data.action?.type==='hide_brain')hideBrain(false);if(data.action?.type==='index')startIndexing();if(data.confirmation)setConfirmation(data.confirmation);if(data.timer_seconds)startTimer(data.timer_seconds);if(data.nodes)setNodes(data.nodes,data.links||[]);if(data.links)setNodes(nodes,data.links);if(data.highlight){selectedNode=data.highlight}if(data.highlight_nodes)activeSources=new Set(data.highlight_nodes);if(data.sources)activeSources=new Set(data.sources.map(source=>'doc:'+source));if(data.highlight||data.highlight_nodes||data.sources)draw(performance.now());if(data.unavailable)setStatus('AI offline');else if(!data.timer_seconds)setStatus('Systems idle');if(data.speak)speak(data.reply)}
async function process(text){let clean=String(text||'').trim();if(/^hey\s+jarvis\b/i.test(clean))clean=clean.replace(/^hey\s+jarvis[\s,.:;-]*/i,'');else if(/^jarvis\b/i.test(clean))clean=clean.replace(/^jarvis[\s,.:;-]*/i,'');if(!clean){say('Please enter a command, sir.');return}if(clean.length>4000){say('That command is too long, sir. Please keep it under 4,000 characters.');return}if(/^show brain$|^open (?:the )?brain$|^show (?:your )?knowledge brain$|^brain$/i.test(clean)){clearConfirmation();showBrain();return}if(/^(?:hide brain|back|interface)$/i.test(clean)){clearConfirmation();hideBrain();return}if(pendingAction&&/^(?:yes|yes sir|proceed|go ahead)$/i.test(clean)){await approvePending();return}if(pendingAction&&/^(?:no|no sir|cancel|stop)$/i.test(clean)){cancelPending();return}if(brainVisible)hideBrain(false);app.classList.add('thinking');setStatus('Processing');const result=await askServer(clean);app.classList.remove('thinking');if(result?.highlight_nodes||result?.sources){const list=result.highlight_nodes||result.sources.map(s=>'doc:'+s);activeSources=new Set(list);draw(performance.now())}}
command.addEventListener('submit',event=>{event.preventDefault();const value=input.value.trim();input.value='';process(value)});
$('#proceed').addEventListener('click',approvePending);$('#cancel').addEventListener('click',cancelPending);$('#file-open').addEventListener('click',()=>{const path=$('#file-open').dataset.path;if(path){say('Shall I proceed, sir?');setConfirmation({type:'open_file',path})}});
$('#settings-toggle').addEventListener('click',()=>{settingsOpen=!settingsOpen;settingsPanel.hidden=!settingsOpen;$('#settings-toggle').setAttribute('aria-expanded',String(settingsOpen));if(settingsOpen)$('#set-sound').focus()});
$('#save-settings').addEventListener('click',saveSettings);$('#index-now').addEventListener('click',startIndexing);
function closeSettings(){settingsOpen=false;settingsPanel.hidden=true;$('#settings-toggle').setAttribute('aria-expanded','false')}
async function startIndexing(){try{const r=await fetch('/api/index/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json();if(!r.ok)throw Error();if(!indexPoll)indexPoll=setInterval(pollIndex,600);pollIndex();if(!data.started&&data.running)setStatus('Indexing')}catch(_){say("I couldn't start indexing, sir. Check the local server and knowledge folder.")}}
async function pollIndex(){if(document.hidden)return;try{const r=await fetch('/api/index/status');if(!r.ok)return;const data=await r.json();if(data.running){lastIndexRunning=true;cancelTyping();$('#reply').textContent=data.message;const ratio=data.total?data.done/data.total:0;$('#progress-band').setAttribute('stroke-dasharray',`${Math.max(1,ratio*circumference)} ${circumference}`);setStatus('Indexing');return}if(lastIndexRunning){lastIndexRunning=false;$('#progress-band').setAttribute('stroke-dasharray','742 609');say(data.message);setStatus(data.error?'Index warning':'Systems idle');loadKnowledge(false)}if(indexPoll){clearInterval(indexPoll);indexPoll=null}}catch(_){}}
let pendingResize=false;function updateIndexStatus(){pollIndex()}
canvas.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY,moved:false};try{canvas.setPointerCapture(event.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>3)drag.moved=true;if(drag.moved){rotY+=dx*.008;rotX=Math.max(-1.1,Math.min(1.1,rotX+dy*.008));drag.x=event.clientX;drag.y=event.clientY;draw(performance.now())}});
canvas.addEventListener('pointerup',event=>{if(!drag)return;const moved=drag.moved;drag=null;if(!moved){const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;let nearest=null,distance=16;for(const point of positions){if(point.z<=.12)continue;const d=Math.hypot(point.x-x,point.y-y);if(d<distance){nearest=point;distance=d}}if(nearest){selectedNode=nearest.node.id;const note=nearest.node.note||nearest.node.summary||'No summary is available.';say(`${nearest.node.name}: ${note}`);if(nearest.node.source==='knowledge'&&nearest.node.path){$('#file-open').dataset.path=nearest.node.path;$('#file-open').hidden=false}else $('#file-open').hidden=true;draw(performance.now())}}if(!reduced&&brainVisible&&!document.hidden)frame=requestAnimationFrame(frameLoop)});
canvas.addEventListener('pointercancel',()=>{drag=null;if(!reduced&&brainVisible&&!document.hidden)frame=requestAnimationFrame(frameLoop)});
function setupRecognition(){const Api=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Api)return;try{recognition=new Api();recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.continuous=true;recognition.onstart=()=>{if(booting())finishBoot(true);$('#mic').setAttribute('aria-pressed','true');app.classList.add('hud-active');setStatus(wakeEnabled?'Listening for Jarvis':'Listening')};recognition.onend=()=>{$('#mic').setAttribute('aria-pressed','false');app.classList.remove('hud-active');if(['Listening','Listening for Jarvis'].includes($('#status').textContent))setStatus('Systems idle')};recognition.onerror=()=>{say('I could not access the microphone, sir. Check browser permission and try again.');setStatus('Voice unavailable')};recognition.onresult=event=>{for(let i=event.resultIndex;i<event.results.length;i++){if(!event.results[i].isFinal)continue;let text=event.results[i][0].transcript.trim();if(wakeEnabled){if(!/\bjarvis\b/i.test(text))continue;text=text.replace(/^.*?\bjarvis\b[\s,.:;-]*/i,'').trim();if(!text){say('At your service, sir.');continue}}process(text)}}}catch(_){recognition=null;say('Voice input could not start in this browser, sir.')}}
$('#mic').addEventListener('click',()=>{if(!settings.voice_enabled){say('Enable voice in settings first, sir.');return}if(!recognition){say('Voice input is not supported by this browser, sir.');return}unlockAudio();if($('#mic').getAttribute('aria-pressed')==='true'){try{recognition.stop()}catch(_){}}else{try{recognition.start()}catch(_){say('I could not start the microphone, sir. Check permission and retry.')}}});
$('#wake').addEventListener('click',()=>{wakeEnabled=!wakeEnabled;$('#wake').setAttribute('aria-pressed',String(wakeEnabled));$('#wake').textContent=wakeEnabled?'WAKE ON':'WAKE';say(wakeEnabled?'Wake word enabled. Say Jarvis before a command, sir.':'Wake word disabled, sir.')});
input.addEventListener('pointerdown',unlockAudio);$('#settings-panel').addEventListener('pointerdown',unlockAudio);
document.addEventListener('keydown',event=>{if(booting())skipBoot();const focused=command.contains(document.activeElement);if(event.key==='Escape'){event.preventDefault();if(settingsOpen)closeSettings();else hideBrain();return}if((event.key==='b'||event.key==='B')&&!focused&&!settingsOpen){event.preventDefault();toggleBrain()}});
function pauseAnimations(){document.body.classList.add('page-hidden');if(frame){cancelAnimationFrame(frame);frame=0}lastFrame=0;frameTimes=[];if(playingAudio){try{playingAudio.pause()}catch(_){}}}
function resumeAnimations(){document.body.classList.remove('page-hidden');if(brainVisible&&!reduced){lastFrame=0;frame=requestAnimationFrame(frameLoop)}if(playingAudio&&settings.voice_enabled)playingAudio.play().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAnimations();else resumeAnimations()});window.addEventListener('blur',pauseAnimations);window.addEventListener('focus',resumeAnimations);reducedQuery.addEventListener?.('change',()=>{reduced=reducedQuery.matches||settings.reduce_motion;if(reduced&&frame){cancelAnimationFrame(frame);frame=0;draw(performance.now())}else if(brainVisible)startBrainRender()});
loadSettings();loadKnowledge(false);startBoot();
